<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0057a8"/>
      <stop offset="100%" stop-color="#00a896"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcb900"/>
      <stop offset="100%" stop-color="#ff9800"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0057a8" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Background shape -->
  <rect x="25" y="25" width="450" height="450" rx="100" fill="#ffffff" filter="url(#shadow)"/>
  <rect x="25" y="25" width="450" height="450" rx="100" fill="none" stroke="url(#primaryGrad)" stroke-width="4" stroke-opacity="0.2"/>

  <!-- Brand Symbol: Hands embracing a rising star of the future -->
  <g transform="translate(130, 75)">
    <!-- Arc 1: Left Nurturing Hand / Path -->
    <path d="M 60 180 C 10 130, 20 50, 80 20 C 60 60, 60 110, 100 150 C 90 165, 75 175, 60 180 Z" fill="url(#primaryGrad)"/>
    
    <!-- Arc 2: Right Empowering Wing / Future Wave -->
    <path d="M 180 180 C 230 130, 220 50, 160 20 C 180 60, 180 110, 140 150 C 150 165, 165 175, 180 180 Z" fill="url(#primaryGrad)" opacity="0.85"/>

    <!-- Rising Star / Future Sun in Center -->
    <circle cx="120" cy="80" r="32" fill="url(#goldGrad)" filter="url(#shadow)"/>
    <path d="M 120 40 L 126 68 L 152 74 L 128 86 L 132 114 L 114 96 L 90 106 L 104 82 L 92 58 L 118 66 Z" fill="#ffffff" opacity="0.9"/>

    <!-- Dynamic Base Smile / Growth Foundation -->
    <path d="M 70 195 C 100 220, 140 220, 170 195 C 150 205, 90 205, 70 195 Z" fill="#fcb900"/>
  </g>

  <!-- Arabic Typography -->
  <text x="250" y="340" text-anchor="middle" font-family="'Cairo', 'Segoe UI', Tahoma, Arial, sans-serif" font-weight="900" font-size="44" fill="#0057a8">صناع المستقبل</text>
  <text x="250" y="380" text-anchor="middle" font-family="'Cairo', 'Segoe UI', Tahoma, Arial, sans-serif" font-weight="700" font-size="22" fill="#00a896">محافظة الفيوم</text>

  <!-- English Badge -->
  <text x="250" y="420" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="16" letter-spacing="3" fill="#8d99ae">THE FUTURE MAKERS</text>
</svg>
